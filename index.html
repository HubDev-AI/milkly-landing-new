<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Milkly - Turn the Internet Into Your Newsletter</title>
    <meta name="description" content="Milkly curates content from news, YouTube, and social media, then uses AI to help you create beautiful newsletters your audience will love." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#fa8e29",
              "amber-glow": "#ffae42",
              "pearl-white": "#f8f7f5",
              "glass-border": "rgba(255, 255, 255, 0.4)",
              "text-main": "#181411",
              "text-muted": "#8c755f",
              "background-light": "#f8f7f5",
            },
            fontFamily: {
              display: ["Plus Jakarta Sans", "sans-serif"],
              brand: ["Bebas Neue", "sans-serif"],
              editorial: ["Cormorant Garamond", "serif"],
              accent: ["Syne", "sans-serif"],
            },
            animation: {
              "float-orb": "float-orb 20s infinite ease-in-out",
              "float-orb-slow": "float-orb 30s infinite ease-in-out reverse",
              "float-y": "float-y 8s ease-in-out infinite",
              "fade-in": "fadeIn 0.5s ease-out forwards",
              "blob-bounce": "blob-bounce 20s infinite ease-in-out alternate",
              "cream-rise": "cream-rise 0.5s ease-out",
              "shimmer": "shimmer 2s infinite",
            },
            keyframes: {
              "float-orb": {
                "0%, 100%": { transform: "translate(0, 0) rotate(0deg) scale(1)" },
                "33%": { transform: "translate(50px, -50px) rotate(10deg) scale(1.05)" },
                "66%": { transform: "translate(-30px, 30px) rotate(-5deg) scale(0.95)" },
              },
              "blob-bounce": {
                 "0%": { transform: "translate(0, 0) scale(1)" },
                 "100%": { transform: "translate(20%, -20%) scale(1.1)" }
              },
              "float-y": {
                "0%, 100%": { transform: "translateY(0px)" },
                "50%": { transform: "translateY(-15px)" },
              },
              fadeIn: {
                "0%": { opacity: "0", transform: "translateY(8px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              "cream-rise": {
                "0%": { opacity: "0", transform: "translateY(20px) scale(0.95)" },
                "100%": { opacity: "1", transform: "translateY(0) scale(1)" },
              },
              "shimmer": {
                "0%": { backgroundPosition: "-200% 0" },
                "100%": { backgroundPosition: "200% 0" },
              },
            },
          },
        },
      };
    </script>

    <style>
      body {
        background-color: #f8f7f5;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Noise overlay for premium texture */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        opacity: 0.06;
        pointer-events: none;
        z-index: 0;
        mix-blend-mode: soft-light;
      }

      /* Ambient radial wash */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        background: 
          radial-gradient(circle at 22% 28%, rgba(250, 142, 41, 0.08) 0%, transparent 52%),
          radial-gradient(circle at 12% 12%, rgba(236, 72, 153, 0.06) 0%, transparent 44%),
          radial-gradient(circle at 86% 82%, rgba(6, 182, 212, 0.07) 0%, transparent 48%),
          radial-gradient(ellipse 115% 105% at 50% 102%, rgba(250, 142, 41, 0.08) 0%, rgba(250, 142, 41, 0.03) 54%, transparent 100%);
        pointer-events: none;
        z-index: 0;
      }

      @keyframes footer-pill-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      /* Ambient Background Blobs (from concept-1) */
      .blob-orange {
        background: radial-gradient(circle at center, rgba(250, 142, 41, 0.3) 0%, rgba(250, 142, 41, 0) 70%);
      }
      .blob-pink {
        background: radial-gradient(circle at center, rgba(236, 72, 153, 0.25) 0%, rgba(236, 72, 153, 0) 70%);
      }
      .blob-cyan {
        background: radial-gradient(circle at center, rgba(6, 182, 212, 0.3) 0%, rgba(6, 182, 212, 0) 70%);
      }

      .liquid-blob {
         position: absolute;
         border-radius: 50%;
         filter: blur(60px);
         opacity: 0.7;
         z-index: -20;
         animation: blob-float 25s infinite ease-in-out alternate;
      }
      @keyframes blob-float {
        0% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(100px, 50px) rotate(20deg) scale(1.1); }
        100% { transform: translate(-50px, 100px) rotate(-10deg) scale(0.9); }
      }

      .glass-surface-overlay {
        position: fixed;
        inset: 0;
        z-index: -10;
        backdrop-filter: blur(52px) saturate(160%) brightness(1.03);
        -webkit-backdrop-filter: blur(52px) saturate(160%) brightness(1.03);
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        background-color: rgba(248, 247, 245, 0.1);
        pointer-events: none;
      }

      .liquid-orb {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(
            circle at 30% 30%,
            rgba(255, 255, 255, 0.9) 0%,
            rgba(255, 255, 255, 0.4) 20%,
            rgba(255, 255, 255, 0.0) 60%,
            rgba(255, 255, 255, 0.1) 100%
        );
        box-shadow: 
            inset -10px -10px 20px rgba(0,0,0,0.05),
            inset 10px 10px 20px rgba(255,255,255,0.8),
            5px 15px 30px rgba(0,0,0,0.1),
            0 0 15px rgba(255,255,255,0.5);
        backdrop-filter: blur(5px); 
        -webkit-backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        z-index: -5;
      }

      .perspective-container {
        perspective: 1200px;
        transform-style: preserve-3d;
      }
      
      .holo-box {
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(40px) saturate(150%);
        -webkit-backdrop-filter: blur(40px) saturate(150%);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 
            0 30px 60px rgba(0,0,0,0.08),
            inset 0 0 0 1px rgba(255,255,255,0.5);
      }
      .holo-box::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: inherit;
        background: linear-gradient(135deg, rgba(255,255,255,0.6), transparent 40%);
        pointer-events: none;
      }

      .liquid-btn {
        background: linear-gradient(135deg, #fa8e29, #ffae42);
        position: relative;
        z-index: 1;
        overflow: hidden;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(250, 142, 41, 0.3);
      }
      .liquid-btn::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 60%);
        transform: scale(0);
        transition: transform 0.6s ease-out;
        pointer-events: none;
      }
      .liquid-btn:hover::after {
        transform: scale(1);
      }
      .liquid-btn:hover {
        box-shadow: 0 8px 25px rgba(250, 142, 41, 0.5);
        transform: translateY(-2px);
      }

      .logo-emblem {
        background: linear-gradient(135deg, #ffffff, #e8e4de);
        box-shadow: 
            inset 2px 2px 5px rgba(255,255,255,1),
            inset -2px -2px 5px rgba(0,0,0,0.08),
            4px 4px 10px rgba(0,0,0,0.08);
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Glass panel (from concept-1) */
      .glass-panel {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
      }
    </style>
</head>
  <body class="bg-pearl-white text-text-main font-display antialiased min-h-screen overflow-x-hidden flex flex-col">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
